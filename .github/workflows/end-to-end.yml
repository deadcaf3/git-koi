name: End to end

# Build git-koi from this checkout, collect the repository owner's real snapshot through
# GitHub's API, render the pond, and attach the result. Nothing is committed. The
# Action, which builds from its own source, is proved by the release workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo +stable build --release --locked
      - name: Collect the owner's snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          ./target/release/git-koi collect "$GITHUB_REPOSITORY_OWNER" --output
          koi-snapshot.json
      - name: Render the pond
        run:
          ./target/release/git-koi render koi-snapshot.json --output-dir
          koi-output
      - name: Attach the koi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi
          path: koi-output/
          if-no-files-found: error
