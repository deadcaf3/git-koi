name: git-profile-koi
description:
  Draw a GitHub account's koi from its public activity, as a pair circling a
  lily pond in light and dark GIFs or as one pixel-art koi, for a profile README.
branding:
  icon: droplet
  color: blue

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  style:
    description:
      pond for two koi in a lily pond (koi-light.gif, koi-dark.gif, stills, and
      preview.html), or classic for one pixel-art koi (koi.gif, koi.png, and
      preview.html).
    default: pond
  season:
    description:
      The pond's season, one of auto, spring, summer, autumn, or winter; auto
      follows the observation date in the northern hemisphere.
    default: auto
  body:
    description:
      The classic koi's body color, one of white, black, asagi, tea, gold, or
      platinum.
    default: white
  output-dir:
    description: Folder, relative to the workspace, that receives the files.
    default: koi
  token:
    description:
      Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Build git-koi from this Action's source
      shell: bash
      run: |
        cargo install --locked --quiet --path "$GITHUB_ACTION_PATH" --root "$RUNNER_TEMP/git-koi"
        echo "$RUNNER_TEMP/git-koi/bin" >> "$GITHUB_PATH"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
      run:
        git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"
    - name: Render the koi
      shell: bash
      env:
        KOI_STYLE: ${{ inputs.style }}
        KOI_SEASON: ${{ inputs.season }}
        KOI_BODY: ${{ inputs.body }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run:
        git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir
        "$KOI_OUTPUT_DIR" --style "$KOI_STYLE" --season "$KOI_SEASON" --body
        "$KOI_BODY"
